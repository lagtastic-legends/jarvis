<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_4 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_4" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_4');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js interactive 3D holographic particle sphere
const containerEl = container || document.body;
const width = containerEl.clientWidth || 400;
const height = containerEl.clientHeight || 400;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
camera.position.z = 240;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
containerEl.appendChild(renderer.domElement);

// Create Holographic Particle Sphere Core & Outer Shell
const particleCount = 2800;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const initialPositions = new Float32Array(particleCount * 3);
const colors = new Float32Array(particleCount * 3);
const scales = new Float32Array(particleCount);

const colorPrimary = new THREE.Color(0x38bdf8);   // Neon cyan / electric blue
const colorAccent = new THREE.Color(0x818cf8);    // Futuristic violet / lavender
const colorHighlight = new THREE.Color(0xa5f3fc); // Intense core white-cyan

const radius = 75;

for (let i = 0; i < particleCount; i++) {
  // Fibonacci / spherical distribution
  const phi = Math.acos(-1 + (2 * i) / particleCount);
  const theta = Math.sqrt(particleCount * Math.PI) * phi;
  
  // Mix layers: core cluster, mid-shell, and floating orbital dust
  let r = radius;
  const layerType = Math.random();
  if (layerType < 0.15) {
    r = radius * (0.35 + Math.random() * 0.4); // Inner dense nucleus
  } else if (layerType > 0.88) {
    r = radius * (1.08 + Math.random() * 0.28); // Outer orbital cloud
  } else {
    r = radius * (0.92 + Math.random() * 0.15); // Main spherical shell
  }

  const x = r * Math.sin(phi) * Math.cos(theta);
  const y = r * Math.sin(phi) * Math.sin(theta);
  const z = r * Math.cos(phi);

  positions[i * 3] = x;
  positions[i * 3 + 1] = y;
  positions[i * 3 + 2] = z;

  initialPositions[i * 3] = x;
  initialPositions[i * 3 + 1] = y;
  initialPositions[i * 3 + 2] = z;

  // Particle color gradient based on radius / elevation
  const mixedColor = new THREE.Color();
  if (layerType < 0.2) {
    mixedColor.copy(colorHighlight);
  } else {
    mixedColor.lerpColors(colorPrimary, colorAccent, (y / radius + 1) * 0.5);
  }

  colors[i * 3] = mixedColor.r;
  colors[i * 3 + 1] = mixedColor.g;
  colors[i * 3 + 2] = mixedColor.b;

  scales[i] = Math.random() * 2.2 + 0.8;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

// Circular soft particle sprite texture
const canvas = document.createElement('canvas');
canvas.width = 64;
canvas.height = 64;
const ctx = canvas.getContext('2d');
const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
gradient.addColorStop(0.25, 'rgba(56, 189, 248, 0.85)');
gradient.addColorStop(0.65, 'rgba(30, 58, 138, 0.35)');
gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
ctx.fillStyle = gradient;
ctx.beginPath();
ctx.arc(32, 32, 32, 0, Math.PI * 2);
ctx.fill();
const particleTexture = new THREE.CanvasTexture(canvas);

const pMaterial = new THREE.PointsMaterial({
  size: 3.8,
  map: particleTexture,
  vertexColors: true,
  transparent: true,
  opacity: 0.88,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particleSystem = new THREE.Points(geometry, pMaterial);
scene.add(particleSystem);

// Concentric holographic orbital lattice rings
const ringGroup = new THREE.Group();

const createRing = (r, count, tiltX, tiltY, col) => {
  const ringGeom = new THREE.BufferGeometry();
  const rPositions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    rPositions[i * 3] = Math.cos(angle) * r;
    rPositions[i * 3 + 1] = 0;
    rPositions[i * 3 + 2] = Math.sin(angle) * r;
  }
  ringGeom.setAttribute('position', new THREE.BufferAttribute(rPositions, 3));
  const rMat = new THREE.PointsMaterial({
    size: 2.4,
    color: col,
    map: particleTexture,
    transparent: true,
    opacity: 0.65,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const ringPoints = new THREE.Points(ringGeom, rMat);
  ringPoints.rotation.x = tiltX;
  ringPoints.rotation.z = tiltY;
  return ringPoints;
};

const ring1 = createRing(88, 120, Math.PI * 0.35, 0.2, 0x00f0ff);
const ring2 = createRing(98, 140, -Math.PI * 0.25, 0.6, 0x38bdf8);
const ring3 = createRing(68, 90, Math.PI * 0.5, 0, 0xa78bfa);

ringGroup.add(ring1);
ringGroup.add(ring2);
ringGroup.add(ring3);
scene.add(ringGroup);

// Interactive mouse reaction & breathing animation
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

const onMouseMove = (e) => {
  const rect = containerEl.getBoundingClientRect();
  const cx = e.clientX - rect.left - rect.width / 2;
  const cy = e.clientY - rect.top - rect.height / 2;
  targetX = (cx / rect.width) * 2;
  targetY = (cy / rect.height) * 2;
};

window.addEventListener('mousemove', onMouseMove);

const onResize = () => {
  const w = containerEl.clientWidth || window.innerWidth;
  const h = containerEl.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
};
window.addEventListener('resize', onResize);

// Animation Loop
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  // Smooth mouse tilt
  mouseX += (targetX - mouseX) * 0.05;
  mouseY += (targetY - mouseY) * 0.05;

  // Particle organic wave / pulse distortion
  const posAttr = geometry.attributes.position;
  const posArr = posAttr.array;
  
  const pulseFactor = 1.0 + Math.sin(elapsedTime * 2.2) * 0.045;
  
  for (let i = 0; i < particleCount; i++) {
    const ix = i * 3;
    const iy = i * 3 + 1;
    const iz = i * 3 + 2;

    const ox = initialPositions[ix];
    const oy = initialPositions[iy];
    const oz = initialPositions[iz];

    // Subtle holographic ripple noise
    const wave = Math.sin(elapsedTime * 3.0 + (ox + oy) * 0.04) * 2.2;
    posArr[ix] = (ox * pulseFactor) + (ox / radius) * wave;
    posArr[iy] = (oy * pulseFactor) + (oy / radius) * wave;
    posArr[iz] = (oz * pulseFactor) + (oz / radius) * wave;
  }
  posAttr.needsUpdate = true;

  // Rotations
  particleSystem.rotation.y = elapsedTime * 0.22 + mouseX * 0.4;
  particleSystem.rotation.x = Math.sin(elapsedTime * 0.18) * 0.1 + mouseY * 0.4;
  
  ring1.rotation.y = -elapsedTime * 0.45;
  ring2.rotation.y = elapsedTime * 0.35;
  ring3.rotation.x = Math.PI * 0.5 + Math.sin(elapsedTime * 0.6) * 0.2;

  ringGroup.rotation.y = mouseX * 0.2;
  ringGroup.rotation.x = mouseY * 0.2;

  renderer.render(scene, camera);
}

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_4 -->
</body>
</html>
